name: Windows Build

on:
  push:
    branches: [ "local", "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "local", "main", "master" ]

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW-w64
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: Build for Windows
      run: |
        make -f Makefile.mingw CC=x86_64-w64-mingw32-g++
    
    # 1. Upload as Artifact (Backup / for PRs)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: namics-windows
        path: bin/namics.exe
        retention-days: 5

    # 2. Publish Nightly Release (Runs on push to main branches)
    - name: Publish Nightly Release
      if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: Nightly Build
        tag_name: nightly
        files: bin/namics.exe
        prerelease: true
        body: "This is the latest automated build from the repository. It is updated automatically on every push."
        overwrite: true

    # 3. Publish Formal Release (Runs on tags v*)
    - name: Publish Stable Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/namics.exe

